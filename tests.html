<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JS Engine Quest — Tests</title>
  <style>
    :root { --bg: #0b0e1f; --panel: #161b36; --line: #2b3264; --text: #e8ebff; --muted: #8e96c8; --ok: #3ee6a8; --bad: #ff5d73; }
    @media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) { --bg: #f4f6fc; --panel: #fff; --line: #d6dbec; --text: #1b1f36; --muted: #5d6488; --ok: #0a8a5b; --bad: #c8243d; } }
    body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 system-ui, sans-serif; padding: 16px; }
    h1 { font-size: 20px; margin: 0 0 4px; } p { color: var(--muted); margin: 0 0 14px; }
    .sum { font-size: 16px; font-weight: 700; margin: 10px 0; }
    section { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; margin-bottom: 12px; }
    h2 { font-size: 15px; margin: 0 0 8px; }
    .row { font-family: Consolas, monospace; font-size: 12.5px; padding: 2px 0; border-bottom: 1px dashed var(--line); }
    .ok { color: var(--ok); } .bad { color: var(--bad); }
    pre { white-space: pre-wrap; margin: 2px 0 6px 18px; color: var(--muted); font-size: 12px; }
  </style>
</head>
<body>
  <h1>🧪 JS Engine Quest — test suite</h1>
  <p>Runs every level, feature program and challenge through the visualizer's engine, then compares the console output with <b>real JavaScript</b> running in this browser. Open this file after changing the engine to catch mistakes.</p>
  <div class="sum" id="sum">Running…</div>
  <div id="out"></div>

  <script src="vendor/acorn.js"></script>
  <script src="js/examples.js"></script>
  <script src="js/react-lessons.js"></script>
  <script>window.JS_LEVELS.splice(0, window.REACT_LEVELS.length); // the React levels are tested on their own</script>
  <script src="js/challenges.js"></script>
  <script src="js/react-challenges.js"></script>
  <script src="js/react-course-data.js"></script>
  <script src="js/react-course-practice.js"></script>
  <script src="js/react-pairs.js"></script>
  <script src="js/interview.js"></script>
  <script src="js/interview-more.js"></script>
  <script src="js/interview-extra.js"></script>
  <script src="js/write-it.js"></script>
  <script src="js/react-interview.js"></script>
  <script src="js/react-interview-more.js"></script>
  <script src="js/react-interview-eco.js"></script>
  <script src="js/engine/core.js"></script>

  <script src="js/engine/classes.js"></script>
  <script src="js/engine/promises.js"></script>
  <script src="js/engine/methods.js"></script>

  <script src="js/engine/threads.js"></script>
  <script src="js/engine/node.js"></script>
  <script src="js/engine/protos.js"></script>
  <script src="js/engine/observers.js"></script>
  <script src="js/engine/evalviz.js"></script>
  <script src="js/engine/nodeplus.js"></script>
  <script src="js/engine/typescript.js"></script>
  <script src="js/engine/jsx.js"></script>
  <script src="js/react/reactlite.js"></script>
  <script src="js/engine/react.js"></script>
  <script src="js/explain.js"></script>
  <script>
  (async function () {
    'use strict';
    const out = document.getElementById('out');
    let pass = 0, fail = 0;
    const section = title => { const s = document.createElement('section'); s.innerHTML = `<h2>${title}</h2>`; out.appendChild(s); return s; };
    const row = (sec, ok, label, detail) => {
      ok ? pass++ : fail++;
      const d = document.createElement('div');
      d.className = 'row ' + (ok ? 'ok' : 'bad');
      d.textContent = (ok ? '✔ ' : '✘ ') + label;
      sec.appendChild(d);
      if (detail && !ok) { const p = document.createElement('pre'); p.textContent = detail; sec.appendChild(p); }
    };

    // ---- run code in the visualizer engine
    function engine(code) {
      const r = new JSEngine.Interpreter(code).run();
      if (r.error) return { error: r.error, lines: [] };
      const last = r.trace[r.trace.length - 1];
      return { lines: last.console.map(l => l.text), steps: r.trace.length, last };
    }

    // ---- run the same code for real, with stand-ins for the visualizer's pretend browser
    function real(code, waitMs) {
      return new Promise(done => {
        const lines = [];
        const fmt = a => typeof a === 'bigint' ? a + 'n' : typeof a === 'string' ? a
          : Array.isArray(a) ? '[' + a.map(x => (typeof x === 'string' ? `'${x}'` : String(x))).join(', ') + ']' : String(a);
        let depth = 0; const counts = {};
        const con = { log: (...a) => lines.push('  '.repeat(depth) + a.map(fmt).join(' ')), group: (...a) => { lines.push('▾ ' + a.join(' ')); depth++; }, groupEnd: () => depth--, count: (k = 'default') => { counts[k] = (counts[k] || 0) + 1; lines.push(k + ': ' + counts[k]); } };
        con.info = con.log; con.warn = con.log; con.error = con.log;
        const users = [{ id: 1, name: 'Ada Lovelace' }, { id: 2, name: 'Linus' }, { id: 3, name: 'Grace Hopper' }];
        const fakeFetch = url => new Promise(res => setTimeout(() => {
          let status = 404, data = { error: 'Not found' };
          const m = String(url).match(/^\/api\/users\/(\d+)$/);
          if (m && users[+m[1] - 1]) { status = 200; data = users[+m[1] - 1]; }
          else if (url === '/api/users') { status = 200; data = users; }
          else if (url === '/api/todos') { status = 200; data = [{ id: 1 }, { id: 2 }, { id: 3 }]; }
          res({ status, ok: status < 300, json: () => Promise.resolve(data) });
        }, 300));
        const els = {};
        const mk = id => (els[id] = { id, textContent: '', listeners: [], addEventListener(t, f) { this.listeners.push([t, f]); }, click() { this.listeners.forEach(([t, f]) => t === 'click' && f.call(this, { type: 'click', target: this })); } });
        ['btn', 'output', 'title', 'name'].forEach(mk);
        const lis = [];
        const doc = { getElementById: id => els[id], querySelector: s => els[s.slice(1)], querySelectorAll: s => (s === 'li' ? lis : []), createElement: tag => ({ tag, textContent: '' }), body: { appendChild(c) { if (c.tag === 'li') lis.push(c); } } };
        const click = (sel, d = 0) => setTimeout(() => els[sel.slice(1)].click(), d);
        const onRej = e => { lines.push('Uncaught (in promise) ' + e.reason); e.preventDefault(); };
        window.addEventListener('unhandledrejection', onRej);
        try { new Function('console', 'fetch', 'document', 'simulateClick', 'requestAnimationFrame', code)(con, fakeFetch, doc, click, cb => setTimeout(() => cb(0), 16)); }
        catch (e) { lines.push('Uncaught ' + e.name + ': ' + e.message); }
        setTimeout(() => { window.removeEventListener('unhandledrejection', onRej); done(lines); }, waitMs);
      });
    }

    // programs whose real-JS output can't be reproduced exactly (module files, console formatting of objects)
    // module files can't run with new Function, and real garbage collection timing is unpredictable
    const SKIP_REAL = new Set(['modules', 'tla', 'platform', 'realnet', 'webpage', 'storage', 'descriptors', 'binary', 'urlabort', 'lazyimport', 'workers', 'nodeloop', 'emitter', 'sharedmem', 'nodefs', 'nodehttp', 'mutationobs', 'commonjs', 'typescript', 'streams']);
    const FEATURES = {
      closuresInLoops: 'const fns = []; for (let i = 0; i < 3; i++) fns.push(() => i); console.log(fns.map(f => f()).join());',
      promiseOrder: 'setTimeout(()=>console.log("t"),0); Promise.resolve().then(()=>console.log("p1")).then(()=>console.log("p2")); queueMicrotask(()=>console.log("q")); console.log("s");',
      adoptTicks: 'Promise.resolve().then(()=>{console.log("a"); return Promise.resolve();}).then(()=>console.log("b"));\nPromise.resolve().then(()=>console.log(1)).then(()=>console.log(2)).then(()=>console.log(3)).then(()=>console.log(4));',
      asyncOrder: 'async function x(){ console.log(1); await undefined; console.log(3); }\nasync function y(){ console.log(2); await undefined; console.log(4); }\nx(); y();',
      classes: 'class A { #s = 1; static n = 0; constructor(v){ this.v = v; A.n++; } get s(){ return this.#s; } m(){ return "A" + this.v; } }\nclass B extends A { m(){ return super.m() + "B"; } }\nconst b = new B(2); console.log(b.m(), b.s, A.n, b instanceof A, Object.keys(b).join());',
      generators: 'function* g(){ const r = yield 1; console.log("got", r); yield 2; return 3; }\nconst it = g(); console.log(it.next().value, it.next("x").value, JSON.stringify(it.next()), JSON.stringify(it.next()));\nfunction* inf(){ let i = 0; while (true) yield i++; } const [p, q] = inf(); console.log(p, q);',
      asyncGen: 'const w = ms => new Promise(r => setTimeout(r, ms));\nasync function* s(){ yield 1; await w(5); yield 2; }\n(async () => { for await (const v of s()) console.log(v); })();',
      mapSet: 'const m = new Map([["a", 1]]); m.set("b", 2); console.log(m.size, [...m.keys()].join(), [...new Set([1, 1, 2])].join());',
      regex: 'console.log("a1b22".match(/\\d+/g).join("|"), "2024-01-05".replace(/(\\d+)-(\\d+)-(\\d+)/, "$3/$2/$1"), /^h/i.test("Hi"));',
      strict: '"use strict"; function t(){ return this; } console.log(t()); try { undeclared = 1; } catch (e) { console.log(e.name); }',
      thenable: '(async () => { const v = await { then(r){ r(42); } }; console.log(v); })();',
      toPrimitive: 'const o = { valueOf(){ return 5; }, toString(){ return "five"; } }; console.log(o + 1, `${o}`, o > 3);',
      bigint: 'console.log(2n ** 64n, typeof 1n, 7n / 2n); try { 1n + 1; } catch (e) { console.log(e.name); }',
      proxy: 'const p = new Proxy({ a: 1 }, { get(t, k){ return k in t ? t[k] : "none"; } }); console.log(p.a, p.b);',
      extendsArray: 'class S extends Array { top(){ return this[this.length - 1]; } } const s = new S(); s.push(1, 2); console.log(s.top(), s instanceof Array);',
      fetch: '(async () => { const r = await fetch("/api/users/2"); console.log((await r.json()).name, r.ok); })(); fetch("/api/x").then(r => console.log(r.status));',
      dom: 'const b = document.getElementById("btn"); b.addEventListener("click", e => console.log("clicked", e.type)); simulateClick("#btn", 50); b.click();',
      tdzError: 'try { console.log(x); let x = 1; } catch (e) { console.log(e.name); }',
      destructuring: 'const { a, b: [c, ...d] } = { a: 1, b: [2, 3, 4] }; console.log(a, c, d.join());',
      evalDirect: 'const x = 10; console.log(eval("x * 2")); function f(){ eval("var leaked = 5"); return leaked; } console.log(f()); const add = new Function("a", "b", "return a + b"); console.log(add(2, 3)); try { eval("1 +"); } catch (e) { console.log(e.name); }',
      intl: 'console.log(new Intl.NumberFormat("en-US", { style: "currency", currency: "USD" }).format(1234.5), new Intl.PluralRules("en-US").select(2), new Intl.ListFormat("en", { type: "conjunction" }).format(["a", "b"]), (1234.5).toLocaleString("de-DE"));',
      labels: 'outer: for (let i = 0; i < 3; i++) { for (let j = 0; j < 3; j++) { if (j === 1) continue outer; if (i === 2) break outer; console.log(i, j); } }',
    };

    // ---- 1) every level
    const lv = section('📚 Levels (engine output vs real JavaScript)');
    for (const L of window.JS_LEVELS) {
      const e = engine(L.code);
      if (e.error) { row(lv, false, L.id, e.error); continue; }
      if (SKIP_REAL.has(L.id)) { row(lv, e.last.kind === 'done', `${L.id} (engine only, ${e.steps} steps)`, e.lines.join('\n')); continue; }
      const r = await real(L.code, /interval/.test(L.id) ? 3500 : 1600);
      const ok = JSON.stringify(e.lines) === JSON.stringify(r);
      row(lv, ok, `${L.id} (${e.steps} steps)`, `engine: ${e.lines.join(' | ')}\nreal:   ${r.join(' | ')}`);
    }

    // ---- 2) feature programs
    const ft = section('⚙️ Language features');
    for (const [name, code] of Object.entries(FEATURES)) {
      const e = engine(code);
      if (e.error) { row(ft, false, name, e.error); continue; }
      const r = await real(code, 900);
      const ok = JSON.stringify(e.lines) === JSON.stringify(r);
      row(ft, ok, name, `engine: ${e.lines.join(' | ')}\nreal:   ${r.join(' | ')}`);
    }
    const mod = engine('// @file a.js\nexport let n = 0; export function inc(){ n++; }\n// @file main.js\nimport { n, inc } from "./a.js"; console.log(n); inc(); console.log(n);');
    row(ft, JSON.stringify(mod.lines) === JSON.stringify(['0', '1']), 'modules: live import bindings', mod.lines.join(' | '));
    const tla = engine('// @file a.js\nconsole.log("a1"); await new Promise(r => setTimeout(r, 50)); export const v = 7; console.log("a2");\n// @file main.js\nimport { v } from "./a.js"; console.log("main", v);');
    row(ft, JSON.stringify(tla.lines) === JSON.stringify(['a1', 'a2', 'main 7']), 'modules: top-level await makes importers wait', tla.lines.join(' | '));
    const weak = engine('let o = { n: 1 }; const w = new WeakRef(o); const r = new FinalizationRegistry(h => console.log("cleanup", h)); r.register(o, "o"); console.log(w.deref().n); o = null; setTimeout(() => console.log(w.deref()), 100);');
    // cleanup callbacks have no guaranteed order relative to timers, so compare the lines in any order
    row(ft, JSON.stringify(weak.lines.slice().sort()) === JSON.stringify(['1', 'cleanup o', 'undefined']), 'WeakRef + FinalizationRegistry follow the simulated GC', weak.lines.join(' | '));
    const mock = engine('mockFetch("/api/x", { ok: 1 }, { delay: 20 }); fetch("/api/x").then(r => r.json()).then(d => console.log(d.ok));');
    row(ft, mock.lines.join() === '1', 'mockFetch custom routes', mock.lines.join(' | '));

    // ---- browser environment (engine-level: these use data the app normally collects between runs)
    const br = section('🌐 Browser environment');
    const engineWith = (code, opts) => { const it = new JSEngine.Interpreter(code, opts); const r = it.run(); const last = r.trace[r.trace.length - 1]; return { it, lines: last.console.map(l => l.text), last }; };
    const netCode = 'fetch("https://api.example.com/u").then(r => r.json()).then(u => console.log(u.name)); fetch("https://down.example.com/").catch(e => console.log(e.message));';
    const n1 = engineWith(netCode, { netCache: new Map() });
    row(br, n1.it.netMisses.length === 2, 'real fetch: first run reports which URLs to download');
    const cache = new Map([[n1.it.netMisses[0].key, { status: 200, headers: [], body: '{"name":"Real Ada"}', latency: 80 }], [n1.it.netMisses[1].key, { error: 'Failed to fetch', latency: 20 }]]);
    const n2 = engineWith(netCode, { netCache: cache });
    row(br, n2.lines.join('|') === 'Failed to fetch|Real Ada', 'real fetch: replay uses the real response and real timing', n2.lines.join(' | '));
    const dl = engineWith('const a = confirm("ok?"); const b = prompt("name?"); console.log(a, b);', { answers: [true, 'Ada'] });
    row(br, dl.lines.join() === 'true Ada', 'confirm / prompt answers are replayed', dl.lines.join(' | '));
    const sg = engineWith('localStorage.setItem("n", Number(localStorage.getItem("n") || 0) + 1); console.log(localStorage.getItem("n"), typeof localStorage.getItem("n"));', { storage: { n: '2' } });
    row(br, sg.lines.join() === '3 string' && sg.it.storageOut.n === '3', 'localStorage reads saved values and returns strings', sg.lines.join(' | '));
    const pg = engineWith('// @file index.html\n<ul id="l"><li>a</li><li>b</li></ul>\n// @file s.js\ndocument.querySelector("#l").addEventListener("click", e => { e.target.classList.add("x"); console.log(e.target.textContent, e.currentTarget.id, e.target.className); }); simulateClick("#l li:last-child", 10);', {});
    row(br, pg.lines.join() === 'b l x', 'real DOM: CSS selectors, bubbling (delegation), classList', pg.lines.join(' | '));
    const ue = engineWith('// @file index.html\n<button>Go</button>\n// @file s.js\ndocument.querySelector("button").onclick = () => console.log("clicked");', { events: [{ type: 'click', path: [0], at: 5 }] });
    row(br, ue.lines.join() === 'clicked', 'clicks made in the page preview are replayed as events', ue.lines.join(' | '));
    const xh = engineWith('const x = new XMLHttpRequest(); x.open("GET", "/api/users/2"); x.onload = () => console.log(x.status, JSON.parse(x.responseText).name); x.send();', {});
    row(br, xh.lines.join() === '200 Linus', 'XMLHttpRequest', xh.lines.join(' | '));
    // ---- platform features (expected values checked against real browsers / Node)
    const pf = section('🧰 Platform features');
    const chk = (label, code, expect, opts) => { const r = engineWith(code, opts || {}); row(pf, r.lines.join(' | ') === expect, label, `engine: ${r.lines.join(' | ')}\nexpect: ${expect}`); };
    chk('Promise.allSettled / any / AggregateError', 'Promise.allSettled([Promise.resolve(1), Promise.reject(new Error("x"))]).then(r => console.log(r.map(x => x.status).join())); Promise.any([Promise.reject(1), Promise.reject(2)]).catch(e => console.log(e.name, e.errors.length));', 'fulfilled,rejected | AggregateError 2');
    chk('property descriptors & seal', 'const o = {}; Object.defineProperty(o, "k", { value: 1 }); o.k = 2; const d = Object.getOwnPropertyDescriptor(o, "k"); console.log(o.k, Object.keys(o).length, JSON.stringify(o), d.writable, d.enumerable); const s = Object.seal({ a: 1 }); s.b = 1; delete s.a; console.log(JSON.stringify(s));', '1 0 {} false false | {"a":1}');
    chk('toSorted / with / groupBy / structuredClone / cause', 'const a = [3, 1, 2]; console.log(a.toSorted().join(), a.join(), a.with(0, 9).join()); console.log(Object.groupBy([1, 2, 3], n => n % 2 ? "odd" : "even").odd.join()); const c = structuredClone({ n: [1] }); console.log(JSON.stringify(c), new Error("e", { cause: "why" }).cause);', '1,2,3 3,1,2 9,1,2 | 1,3 | {"n":[1]} why');
    chk('typed arrays, shared buffers, TextEncoder', 'const b = new Uint8Array(2); b[0] = 256; b[1] = -1; const buf = new ArrayBuffer(4); new Uint32Array(buf)[0] = 258; console.log(b.join(), new Uint8Array(buf).join(), new TextEncoder().encode("é").length);', '0,255 2,1,0,0 2');
    chk('URL / URLSearchParams', 'const u = new URL("https://a.example/p?x=1"); u.searchParams.set("y", "2"); console.log(u.hostname, u.search, new URLSearchParams("a=1&b=2").get("b"));', 'a.example ?x=1&y=2 2');
    chk('AbortController cancels fetch', 'const c = new AbortController(); fetch("/api/slow", { signal: c.signal }).catch(e => console.log(e.name)); setTimeout(() => c.abort(), 10);', 'AbortError');
    chk('Symbol.hasInstance / toStringTag / Object.prototype.toString', 'class Even { static [Symbol.hasInstance](n) { return n % 2 === 0; } } console.log(4 instanceof Even, Object.prototype.toString.call([]), String({ get [Symbol.toStringTag]() { return "X"; } }));', 'true [object Array] [object X]');
    chk('dynamic import()', '// @file m.js\nexport const v = 5;\n// @file main.js\nimport("./m.js").then(m => console.log(m.v));', '5');
    chk('Web Worker messages are copies', '// @file worker.js\nself.onmessage = e => { e.data.push(1); postMessage(e.data.length); };\n// @file main.js\nconst w = new Worker("worker.js"); const arr = []; w.onmessage = e => console.log(e.data, arr.length); w.postMessage(arr);', '1 0');
    chk('Node: nextTick → promises → timers → check', '// @env node\nsetImmediate(() => console.log("i")); setTimeout(() => console.log("t"), 0); Promise.resolve().then(() => console.log("p")); process.nextTick(() => console.log("n")); console.log("s");', 's | n | p | t | i');
    chk('Node: EventEmitter + util.promisify', '// @env node\nconst E = require("events"); const e = new E(); e.once("x", v => console.log("once", v)); e.emit("x", 1); e.emit("x", 2); require("util").promisify((a, cb) => cb(null, a + 1))(1).then(v => console.log(v));', 'once 1 | 2');
    const s1 = engineWith('console.log(Math.random(), crypto.randomUUID());', { seed: 9 }).lines.join(), s2 = engineWith('console.log(Math.random(), crypto.randomUUID());', { seed: 9 }).lines.join();
    row(pf, s1 === s2, 'seeded randomness repeats exactly on re-runs');
    const intl = engineWith('function P(x){ this.x = x; } const a = new P(1), b = new P(2), c = { x: 3, y: 1 }; const f = o => o.x; f(a); f(b); f(c); console.log("ok");', {});
    row(pf, intl.last.ic && intl.last.ic.some(s => s.shapes === 2), 'engine internals: inline cache sees 2 hidden classes', JSON.stringify(intl.last.ic));
    const lim = engineWith('while (true) {}', { maxSteps: 150 });
    row(br, lim.last.kind === 'error' && /150 steps/.test(lim.last.msg), 'step limit setting');

    // ---- threads, shared memory and Node built-ins (expected values checked against real Chrome / Node)
    const th = section('🧵 Threads, shared memory & Node modules');
    const chk2 = (label, code, expect, test) => {
      let r; try { r = engineWith(code, {}); } catch (e) { row(th, false, label, String(e && e.stack || e)); return; }
      const got = r.lines.join(' | ');
      row(th, got === expect && r.last.kind === 'done' && (!test || test(r)), label, `engine: ${got}\nexpect: ${expect}\nlast: ${r.last.kind} ${r.last.msg || ''}`);
    };
    chk2('SharedArrayBuffer is shared (not copied) with a worker', '// @file worker.js\nself.onmessage = e => { const a = new Int32Array(e.data); a[0] = 42; postMessage("done"); };\n// @file main.js\nconst sab = new SharedArrayBuffer(4); const arr = new Int32Array(sab); const w = new Worker("worker.js"); w.onmessage = () => console.log(arr[0]); w.postMessage(sab);', '42');
    const race = safe => `// @file worker.js\nself.onmessage = e => {\n  const a = new Int32Array(e.data);\n  for (let i = 0; i < 3; i++) {\n    ${safe ? 'Atomics.add(a, 0, 1);' : 'const v = a[0];\n    a[0] = v + 1;'}\n  }\n  postMessage("done");\n};\n// @file main.js\nconst sab = new SharedArrayBuffer(4); const a = new Int32Array(sab); let done = 0;\nfor (let k = 0; k < 2; k++) { const w = new Worker("worker.js"); w.onmessage = () => { if (++done === 2) console.log(a[0]); }; w.postMessage(sab); }`;
    chk2('two threads interleave: unsafe read-then-write loses updates', race(false), '3', r => r.it.trace.some(s => s.threads && s.threads.length === 2));
    chk2('Atomics.add makes the same counter correct', race(true), '6');
